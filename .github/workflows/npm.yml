name: npm

on:
  release:
    types: [published]
  workflow_dispatch:

run-name: ${{ github.ref_name }} -> npm ( ${{ github.run_attempt }} )

jobs:

  npm:
    name: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:

    - name: Echo current date and time
      id: datetime
      run: |
        echo "datetime: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 1

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '24'

    - name: Install Bun
      run: |
        curl -fsSL https://bun.sh/install | bash
        echo "$HOME/.bun/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: bun install

    - name: Get version
      id: get_version
      run: |
        export version=$(node -p "require('./package.json').version")
        echo "version=$version" >> $GITHUB_OUTPUT

    #validates that the version is a valid semver
    - name: Validate version
      id: validate_version
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version: $VERSION"
          exit 1
        fi

    # The first version may be published by hand (npm trusted publishing can
    # only be configured for an existing package). Re-publishing that version
    # through a GitHub release would fail, so skip instead.
    - name: Skip when the version already exists on npm
      id: skip
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        if npm view "opencode-prompt-logger@$VERSION" version > /dev/null 2>&1; then
          echo "opencode-prompt-logger@$VERSION is already on npm, nothing to publish"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build
      if: steps.skip.outputs.skip == 'false'
      run: bun run build

    - name: Strip _authToken from npmrc (let OIDC kick in)
      if: steps.skip.outputs.skip == 'false'
      run: |
        npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        if [ -f "$npmrc" ]; then
          sed -i '/_authToken/d' "$npmrc"
        fi

    - name: Publish to npm
      if: steps.skip.outputs.skip == 'false'
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
